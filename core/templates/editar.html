<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Editar Reporte | Sistema ETL</title>
    <style>
        :root {
            --primary: #8b5cf6;
            --primary-focus: rgba(139, 92, 246, 0.2);
            --bg-body: #f3f4f6;
            --bg-surface: #ffffff;
            --text-main: #1f2937;
            --text-muted: #6b7280;
            --border: #e5e7eb;
        }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-body);
            color: var(--text-main);
            margin: 0;
            padding: 2rem 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .card {
            background: var(--bg-surface);
            border-radius: 0.75rem;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            padding: 2.5rem;
            width: 100%;
            max-width: 650px;
            border-top: 5px solid var(--primary);
        }

        .header-section {
            margin-bottom: 2rem;
            border-bottom: 1px solid var(--border);
            padding-bottom: 1rem;
        }

        h2 {
            margin-top: 0;
            margin-bottom: 0.5rem;
            font-size: 1.5rem;
            color: #111827;
        }

        .form-group {
            margin-bottom: 1.25rem;
            display: flex;
            flex-direction: column;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        label {
            font-weight: 600;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: #374151;
        }

        input,
        select {
            padding: 0.75rem 1rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            font-size: 1rem;
            width: 100%;
            box-sizing: border-box;
            transition: all 0.2s ease-in-out;
            background-color: #f9fafb;
        }

        /* Mejora UX: Efecto al hacer clic en un input */
        input:focus,
        select:focus {
            outline: none;
            border-color: var(--primary);
            background-color: #ffffff;
            box-shadow: 0 0 0 3px var(--primary-focus);
        }

        .btn-container {
            display: flex;
            gap: 1rem;
            margin-top: 2.5rem;
        }

        .btn {
            padding: 0.75rem 1.5rem;
            border-radius: 0.375rem;
            border: none;
            font-weight: 600;
            font-size: 1rem;
            cursor: pointer;
            text-decoration: none;
            text-align: center;
            flex: 1;
            transition: background-color 0.2s;
        }

        .btn-save {
            background-color: var(--primary);
            color: white;
        }

        .btn-save:hover {
            background-color: #7c3aed;
        }

        .btn-cancel {
            background-color: #ffffff;
            color: #4b5563;
            border: 1px solid #d1d5db;
        }

        .btn-cancel:hover {
            background-color: #f3f4f6;
        }

        .message {
            padding: 1rem;
            border-radius: 0.375rem;
            font-weight: 600;
            margin-bottom: 0.5rem;
        }

        .message-error {
            background-color: #fee2e2;
            color: #b91c1c;
            border-left: 4px solid #ef4444;
        }

        .message-success {
            background-color: #d1fae5;
            color: #047857;
            border-left: 4px solid #10b981;
        }

        /* Mejora Mobile: Se adapta a pantallas de celular */
        @media (max-width: 550px) {
            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .btn-container {
                flex-direction: column-reverse;
            }
        }
    </style>
</head>

<body>
    <main class="card">
        <div class="header-section"
            style="border-bottom: 1px solid var(--border); padding-bottom: 1rem; margin-bottom: 2rem;">
            <h2 style="margin-top: 0; margin-bottom: 0.5rem; color: #111827; font-size: 1.8rem;">Editar Reporte</h2>
            <p style="color: #6b7280; margin: 0; font-size: 1.1rem;">
                Docente: <strong style="color: #8b5cf6;">{{ registro.profesor.nombre }}</strong>
            </p>
        </div>

        {% if messages %}
        <div style="margin-bottom: 1.5rem;">
            {% for message in messages %}
            <div
                class="message {% if message.tags == 'error' %}message-error{% elif message.tags == 'success' %}message-success{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST">

            {% csrf_token %}

            <div class="form-group">
                <label for="programa">Programa / curso </label>
                <input type="text" id="programa" name="programa" value="{{ registro.programa }}" required>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="estado">Estado</label>
                    <select id="estado" name="estado">
                        <option value="Activo" {% if 'Activo' in registro.estado %}selected{% endif %}>Activo</option>
                        <option value="Deprecado" {% if 'Deprecado' in registro.estado %}selected{% endif %}>Deprecado
                        </option>
                    </select>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="cantidad">Cantidad de respuestas</label>
                    <input type="number" id="cantidad" name="cantidad" value="{{ registro.cantidad }}" required min="0">
                </div>
                <div class="form-group">
                    <label for="ventas_totales">Ventas totales ($)</label>
                    <input type="number" id="ventas_totales" name="ventas_totales" value="{{ registro.ventas_totales }}"
                        required min="0">
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="isn">ISN</label>
                    <input type="number" id="isn" name="isn" value="{{ registro.isn }}" required>
                </div>
                <div class="form-group">
                    <label for="nps">NPS</label>
                    <input type="number" id="nps" name="nps" value="{{ registro.nps }}" required>
                </div>
            </div>

            <div class="btn-container">
                <a href="{% url 'gestion_reportes' %}" class="btn btn-cancel">Cancelar</a>
                <button type="submit" class="btn btn-save">Guardar cambios</button>
            </div>
        </form>
    </main>
</body>

</html>
